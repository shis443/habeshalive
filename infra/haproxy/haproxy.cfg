# HabeshaLive SRS load balancer — fronts N SRS nodes on the same external
# ports SRS itself used to publish (1935 RTMP, 1985 HTTP API, 8080 HLS/HTTP).
# Scaling knob: to add a node, add another `server` line to each backend
# below and a matching service block in docker-compose.yml — nothing else
# needs to change (app code addresses SRS via these same external ports
# regardless of how many nodes sit behind them).
#
# CROSS-NODE HLS ROUTING: RTMP is a binary protocol, so the `rtmp_in`
# frontend below load-balances in raw TCP mode with no visibility into the
# stream key — a given publish can land on either node, independently of
# which node `balance uri` (below) picks for that same stream's HLS
# requests. This was a live 404 bug, reproduced and fixed twice:
#   1st attempt: SRS's native origin_cluster/coworkers relay. Looked right
#      from the docs (infra/srs/vendor/trunk/conf/origin.cluster.serverA.conf),
#      config parsed with no errors, but empirically it only relays
#      RTMP/HTTP-FLV *play* requests via redirect — not static HLS file
#      serving, so it did nothing for this setup. Reverted.
#   Actual fix: docker-compose.yml mounts srs_hls_data as a shared volume
#      for hls_path on both srs-1 and srs-2, so whichever node serves an
#      HLS request can read segments regardless of which node ingested the
#      RTMP stream. Verified live: publish routed to one node, HLS fetched
#      through haproxy (uri-hash) repeatedly, 200 with correct manifest
#      every time.

global
    maxconn 4096

defaults
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# HAProxy's own built-in Prometheus exporter (native since 2.0, no sidecar
# needed) — see https://www.haproxy.com/blog/haproxy-exposes-a-prometheus-metrics-endpoint
frontend metrics_in
    bind *:9101
    mode http
    http-request use-service prometheus-exporter if { path /metrics }

# RTMP ingest — round-robin per new connection. A given publish stays on
# whichever node it started on for the life of that TCP connection (that's
# inherent to TCP proxying, not something balance mode changes) — see the
# limitation above for what this does NOT guarantee across connections.
frontend rtmp_in
    bind *:1935
    mode tcp
    default_backend srs_rtmp

backend srs_rtmp
    mode tcp
    balance leastconn
    server srs-1 srs-1:1935 check
    server srs-2 srs-2:1935 check

# SRS's own HTTP management API — not stream-critical, plain round robin.
frontend srs_api_in
    bind *:1985
    mode tcp
    default_backend srs_api

backend srs_api
    mode tcp
    balance roundrobin
    server srs-1 srs-1:1985 check
    server srs-2 srs-2:1985 check

# HLS/HTTP playback — HTTP mode lets us hash on the request URI (which
# contains the stream key, e.g. /live/<stream_key>.m3u8), so repeat
# requests for the same stream consistently reach the same node.
frontend hls_in
    bind *:8080
    mode http
    default_backend srs_hls

backend srs_hls
    mode http
    balance uri
    server srs-1 srs-1:8080 check
    server srs-2 srs-2:8080 check
