app = "habeshalive-srs"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# SRS_WEBHOOK_SECRET and API_WEBHOOK_BASE are set via `flyctl secrets set`,
# not here — see the deploy steps in docs/architecture.md.

# Public, not sensitive — this app's dedicated IPv4 (required for WebRTC/UDP,
# see the services.protocol="udp" block below). Pins the ICE candidate SRS
# advertises for WHIP publishing; see docker-entrypoint.sh's own comment for
# why config-time `*` auto-detection is wrong here. Port is explicit (8000,
# not SRS's actual internal listen port) because without it SRS derives the
# candidate's port from whatever it's really bound to — which, behind the
# socat relay (see docker-entrypoint.sh), is the internal-only 18000, not
# the real public port clients must connect to.
[env]
  SRS_WEBRTC_CANDIDATE = "169.155.60.123:8000"

# RTMP ingest — raw TCP, no TLS (OBS/RTMP clients use plain rtmp://, not
# rtmps://). Fly's http_service block below handles TLS for HLS instead;
# this port doesn't need it.
[[services]]
  internal_port = 1935
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 1935

# WHIP (browser-based) ingest — two distinct paths, both needed:
#  1. Signaling: the WHIP handshake (SDP offer/answer) is a plain HTTPS POST
#     to SRS's http_api server, port 1985 — NOT the same as http_service's
#     8080 (that's http_server, for HLS file serving only; confirmed via
#     SRS's own WHIP docs, whose example URL is :1985, and by testing 8080
#     directly, which 404s). Exposed on external 8443 (443 is already
#     claimed by http_service below) with its own TLS termination — a
#     browser on an HTTPS page (Vercel) can't POST to a plain http:// WHIP
#     endpoint any more than it could fetch an http:// HLS manifest.
#
#     internal_port is 1986 (the docker-entrypoint.sh-launched nginx path
#     filter), NOT SRS's real http_api port 1985 directly — SRS's http_api
#     also serves /api/v1/*, its unauthenticated admin surface (client
#     enumeration, DELETE-to-kick), on this exact same listener with no
#     path-scoped ACL of its own. Confirmed live before this fix: that
#     admin API was reachable on this exact port, unauthenticated, from
#     the public internet. See infra/srs/conf/whip-proxy.nginx.conf for
#     the fix — it allow-lists only /rtc/v1/whip/ and 403s everything else.
#  2. Media: once signaling completes, actual audio/video flows over UDP
#     (ICE/SRTP) on port 8000 below. Unverified whether Fly's UDP proxying
#     "just works" with SRS's default 0.0.0.0 bind or needs more — Fly's own
#     docs note UDP services must be reached via a specific internal address
#     (fly-global-services) on some setups; testing this empirically rather
#     than assuming, same as the RTMP shared-IPv4 issue earlier.
[[services]]
  internal_port = 1986
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[[services]]
  internal_port = 8000
  protocol = "udp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8000

# HLS playback — needs real TLS: apps/web is deployed on Vercel over
# HTTPS, and a browser loading an https:// page will block a plain
# http:// HLS fetch as mixed content. Fly's http_service (unlike a raw
# TCP passthrough) terminates TLS automatically, so this becomes
# https://habeshalive-srs.fly.dev/live/<key>.m3u8 for free.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
