# Path-filtering reverse proxy fronting SRS's http_api (127.0.0.1:1985) on
# the port Fly actually exposes to the public internet (see fly.toml's
# comment on the WHIP [[services]] block — this replaces the old
# internal_port: 1985 direct mapping).
#
# Why this exists: SRS's http_api serves both WHIP publish signaling
# (/rtc/v1/whip/ — a browser must reach this directly and publicly, no
# broker in front of publish) and its admin API (/api/v1/* — client
# enumeration, DELETE-to-kick, raw config/reload) on the exact same port,
# with no path-scoped ACL of its own (see vendor/trunk/conf/full.conf's
# http_api.auth block — it's all-or-nothing Basic Auth for the whole
# listener, which would also lock out WHIP publish since browsers don't
# send SRS's Basic Auth credentials). Confirmed live before this fix:
# `curl https://habeshalive-srs.fly.dev:8443/api/v1/clients/` returned
# HTTP 200 with real connected-client data, completely unauthenticated —
# anyone on the internet could enumerate, and via DELETE, kick any
# connected publisher.
#
# /rtc/v1/whep/ is deliberately NOT allow-listed below either: WHEP
# playback signaling goes server-to-server from apps/api to SRS over Fly's
# private 6PN network (SRS_ADMIN_API_BASE, see apps/api/src/common/env.ts
# and apps/api/src/streams/whep-routes.ts), never browser-to-SRS directly —
# so there is no legitimate public caller for it, and leaving it closed is
# strictly safer than the minimum the WHEP spec review asked for.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-whip-proxy.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 1986;

        location /rtc/v1/whip/ {
            proxy_pass http://127.0.0.1:1985;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Everything else, including /api/v1/* and /rtc/v1/whep/ — see file
        # comment above for why both are excluded from the allow-list.
        location / {
            return 403;
        }
    }

    # Internal-only bridge for SRS's admin API (/api/v1/*), reachable
    # exclusively over Fly's private 6PN network — never given a public
    # port mapping in fly.toml, the same way this port's number (1985) was
    # never publicly mapped even before this block existed. This exists to
    # fix a real connectivity gap, not to add a new capability: Fly's 6PN
    # (the network apps/api/src/common/env.ts's SRS_ADMIN_API_BASE,
    # http://habeshalive-srs.internal:1985, actually resolves over) is
    # IPv6-only, but SRS's own http_api only ever binds IPv4
    # (0.0.0.0:1985 — confirmed live via /proc/net/tcp6 on the real
    # machine showing no entry for this port at all). A direct
    # SRS-side dual-stack `listen 1985 [::]:1985;` was tried and reverted
    # (see infra/srs/conf/srs.conf.template's own comment on that attempt
    # and why it didn't work) — SRS accepted the directive but never
    # actually opened the second listener. This nginx bridge sidesteps
    # that entirely: it listens on IPv6 itself (nginx's dual-stack support
    # is real and doesn't have whatever limitation SRS's does) and forwards
    # to SRS over IPv4 loopback, within the same container.
    #
    # ipv6only=on is explicit, not relying on nginx's default (on since
    # 1.3.4+) — this must never silently also grab IPv4 traffic on the
    # same port number, which would conflict with SRS's own 0.0.0.0:1985
    # bind and fail to start.
    server {
        listen [::]:1985 ipv6only=on;

        location /api/v1/ {
            proxy_pass http://127.0.0.1:1985;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Same allow-list discipline as the public server block above,
        # applied here too even though network-level reachability (no
        # fly.toml [[services]] entry for this listener) already keeps it
        # off the public internet — defense in depth, not redundant: this
        # also means WHEP's own /rtc/v1/whep/ signaling stays unreachable
        # even from this internal bridge, matching the deliberate choice
        # documented above that apps/api brokers WHEP over its own direct
        # connection to SRS's real port, not through any proxy layer.
        location / {
            return 403;
        }
    }
}
