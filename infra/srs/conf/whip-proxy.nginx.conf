# Path-filtering reverse proxy fronting SRS's http_api (127.0.0.1:1985) on
# the port Fly actually exposes to the public internet (see fly.toml's
# comment on the WHIP [[services]] block — this replaces the old
# internal_port: 1985 direct mapping).
#
# Why this exists: SRS's http_api serves both WHIP publish signaling
# (/rtc/v1/whip/ — a browser must reach this directly and publicly, no
# broker in front of publish) and its admin API (/api/v1/* — client
# enumeration, DELETE-to-kick, raw config/reload) on the exact same port,
# with no path-scoped ACL of its own (see vendor/trunk/conf/full.conf's
# http_api.auth block — it's all-or-nothing Basic Auth for the whole
# listener, which would also lock out WHIP publish since browsers don't
# send SRS's Basic Auth credentials). Confirmed live before this fix:
# `curl https://habeshalive-srs.fly.dev:8443/api/v1/clients/` returned
# HTTP 200 with real connected-client data, completely unauthenticated —
# anyone on the internet could enumerate, and via DELETE, kick any
# connected publisher.
#
# /rtc/v1/whep/ is deliberately NOT allow-listed on the *public* server
# block below: WHEP playback signaling goes server-to-server from apps/api
# to SRS over Fly's private 6PN network (SRS_ADMIN_API_BASE, see
# apps/api/src/common/env.ts and apps/api/src/streams/whep-routes.ts),
# never browser-to-SRS directly — so there is no legitimate public caller
# for it, and leaving it closed here is strictly safer than the minimum
# the WHEP spec review asked for.
#
# It IS allow-listed on the *internal* server block further down, though —
# found live, the hard way: SRS_ADMIN_API_BASE (http://habeshalive-srs.internal:1985)
# is the exact same address:port this file's internal IPv6 bridge listens
# on (added later — see that block's own comment for the IPv4/IPv6 story).
# Every request apps/api sends there, admin-API AND WHEP broker calls
# alike, now passes through this same nginx, not directly to SRS — an
# internal bridge that only allow-listed /api/v1/ silently 403'd the WHEP
# broker's own /rtc/v1/whep/ traffic too, confirmed via a real werift
# WebRTC client test against production before this was caught.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-whip-proxy.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 1986;

        location /rtc/v1/whip/ {
            proxy_pass http://127.0.0.1:1985;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Everything else, including /api/v1/* and /rtc/v1/whep/ — see file
        # comment above for why both are excluded from the allow-list.
        location / {
            return 403;
        }
    }

    # Internal-only bridge for SRS's admin API (/api/v1/*), reachable
    # exclusively over Fly's private 6PN network — never given a public
    # port mapping in fly.toml, the same way this port's number (1985) was
    # never publicly mapped even before this block existed. This exists to
    # fix a real connectivity gap, not to add a new capability: Fly's 6PN
    # (the network apps/api/src/common/env.ts's SRS_ADMIN_API_BASE,
    # http://habeshalive-srs.internal:1985, actually resolves over) is
    # IPv6-only, but SRS's own http_api only ever binds IPv4
    # (0.0.0.0:1985 — confirmed live via /proc/net/tcp6 on the real
    # machine showing no entry for this port at all). A direct
    # SRS-side dual-stack `listen 1985 [::]:1985;` was tried and reverted
    # (see infra/srs/conf/srs.conf.template's own comment on that attempt
    # and why it didn't work) — SRS accepted the directive but never
    # actually opened the second listener. This nginx bridge sidesteps
    # that entirely: it listens on IPv6 itself (nginx's dual-stack support
    # is real and doesn't have whatever limitation SRS's does) and forwards
    # to SRS over IPv4 loopback, within the same container.
    #
    # ipv6only=on is explicit, not relying on nginx's default (on since
    # 1.3.4+) — this must never silently also grab IPv4 traffic on the
    # same port number, which would conflict with SRS's own 0.0.0.0:1985
    # bind and fail to start.
    server {
        listen [::]:1985 ipv6only=on;

        location /api/v1/ {
            proxy_pass http://127.0.0.1:1985;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Also allow-listed here, unlike the public server block above —
        # apps/api's WHEP broker (streams/whep-routes.ts's brokerWhepOffer)
        # sends its SDP offer to this exact address:port
        # (SRS_ADMIN_API_BASE), so this listener has to carry that traffic
        # too, not just /api/v1/. Still never reachable from the public
        # internet — no fly.toml [[services]] entry maps to this listener
        # at all, same as /api/v1/ above.
        location /rtc/v1/whep/ {
            proxy_pass http://127.0.0.1:1985;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Serves SRS's dvr{} recordings (srs.conf.template's vhost.dvr
        # block) directly off disk — a plain static-file location, not a
        # proxy_pass, since there's no upstream server for this, just
        # files SRS itself wrote. The whole reason dvr_path lives at
        # ./objs/dvr/ instead of under ./objs/nginx/html (see that
        # config's own comment) is so nothing publicly reachable —
        # including this nginx's own public server block above, and the
        # Cloudflare Tunnel in docker-entrypoint.sh — can serve these
        # files; this internal-only IPv6 listener is the one deliberate
        # exception, reachable only over Fly's private 6PN. Trailing
        # slashes on both `location` and `alias` matter here (nginx
        # substitutes the location prefix for the alias path rather than
        # appending it) — without them a request for /dvr/x would resolve
        # to /usr/local/srs/objs/dvrx instead of .../objs/dvr/x.
        location /dvr/ {
            alias /usr/local/srs/objs/dvr/;
        }

        # Defense in depth beyond the three paths above — network-level
        # reachability (no fly.toml [[services]] entry for this listener)
        # already keeps this off the public internet regardless.
        location / {
            return 403;
        }
    }
}
