global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]

  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:9101"]

  - job_name: srs
    metrics_path: /metrics
    static_configs:
      - targets: ["srs-1:9972", "srs-2:9972"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
