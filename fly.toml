app = "habeshalive"
primary_region = "ams"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  API_PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
